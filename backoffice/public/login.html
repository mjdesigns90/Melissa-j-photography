<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private sign-in · MJPhotography</title><link rel="stylesheet" href="/manager.css"><link rel="stylesheet" href="/login.css"></head><body>
<header><a href="https://melissajphotography.com">MJPhotography</a><span>PRIVATE BACK OFFICE</span></header>
<main class="login"><p class="eyebrow">A SPACE FOR YOUR WORK</p><h1>Welcome back.</h1><p>Sign in to arrange your photographs and save private drafts.</p>
<p id="auth-status" role="status" aria-live="polite">Checking secure connection…</p>
<form id="request-code" hidden><label>Your email<input id="email" type="email" autocomplete="email" required maxlength="254"></label><button type="submit">Send sign-in code</button></form>
<form id="verify-code" hidden><label>Email code<input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" minlength="6" maxlength="10" required></label><button type="submit">Sign in</button><button type="button" id="back">Use a different email</button></form>
<p class="quiet">Access is limited to the portfolio owner. Your public website stays unchanged.</p>
</main><script src="/login.js"></script></body></html>
